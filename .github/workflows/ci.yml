name: CI

# Roda a cada push na main e em todo pull request, impedindo que
# código com erro de tipo, lint ou teste quebrado chegue à branch principal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Verificação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Analisar código (lint)
        run: npm run lint

      - name: Conferir formatação
        run: npm run format:check

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_sqlite, zip
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Conferir estilo (Pint)
        run: vendor/bin/pint --test

      - name: Auditoria de segurança
        run: composer audit

      - name: Executar testes
        run: php artisan test
