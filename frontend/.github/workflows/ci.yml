name: CI

# Roda a cada push na main e em todo pull request, impedindo que
# código com erro de tipo, lint ou teste quebrado chegue à branch principal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Verificação
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Analisar código (lint)
        run: npm run lint

      - name: Conferir formatação
        run: npm run format:check

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build
